apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-platform-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://github.com/SanidhyaNegi/cloud-devops-platform.git"
    targetRevision: HEAD
    path: helm/devops-app
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: devops-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
